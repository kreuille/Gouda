<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gouda - Kiro AI</title>
    
    <!-- PWA & Mobile Meta -->
    <link rel="manifest" href="/Gouda/manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark">
    <!-- Bouton de bascule de la barre latérale pour mobile/desktop -->
    <button id="sidebar-toggle" class="sidebar-toggle" title="Masquer le panneau">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
    </button>
    
    <aside class="sidebar" id="sidebar">
        <h1 class="sidebar-title"><span class="sidebar-logo">🦊</span> Gouda <span class="version-badge">2.2</span></h1>
        <a href="https://www.renaud-dekode.fr" target="_blank" rel="noopener noreferrer" class="sidebar-credit">by Renaud Dékode</a>
        <button id="new-chat-btn" class="new-chat-btn">+ Nouvelle conversation</button>

        <!-- Section des Rôles -->
        <div class="sp-section">
            <div class="sp-header">
                <span class="sp-toggle" data-target="sp-content">&#9656;</span>
                <span class="sp-title">Rôles</span>
                <button id="sp-add-btn" class="sp-add-btn" title="Ajouter un rôle">+</button>
            </div>
            <div id="sp-content" class="sp-content" style="display:none">
                <select id="sp-select" class="sp-select">
                    <option value="">-- Aucun rôle --</option>
                </select>
                <div id="sp-list" class="sp-list"></div>
            </div>
        </div>

        <!-- Section des Conversations et Recherche -->
        <div class="conv-section">
            <div class="search-container">
                <input type="text" id="conv-search" class="conv-search" placeholder="Rechercher une conversation...">
            </div>
            <div id="conv-list" class="conv-list"></div>
        </div>

        <!-- Pied de page avec options de thème et config -->
        <div class="sidebar-footer">
            <button id="theme-toggle" class="footer-btn">Thème</button>
            <button id="config-btn" class="footer-btn">Configuration</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="chat-header">
            <div class="model-selectors">
                <select id="model-select" class="model-select" title="Modèle Texte"></select>
                <select id="image-model-select" class="model-select" title="Modèle Image"></select>
                <select id="search-model-select" class="model-select" title="Modèle Recherche"></select>
            </div>
            <div id="cost-info" class="cost-info">0.0000 $</div>
        </header>

        <div id="chat-container" class="chat-container">
            <!-- Les messages sont injectés dynamiquement ici -->
        </div>

        <div class="input-area">
            <div id="attach-preview" class="attach-preview"></div>
            <div class="input-wrapper">
                <button id="attach-btn" class="icon-btn" title="Joindre un fichier (Image, PDF, Texte)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <textarea id="prompt-input" placeholder="Posez votre question... (Shift+Entrée pour sauter une ligne)" rows="1"></textarea>
                <button id="mic-btn" class="icon-btn" title="Dictée vocale">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button id="send-btn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div id="token-info" class="token-info">0 tokens</div>
            <input type="file" id="file-input" style="display:none" multiple>
        </div>
    </main>

    <!-- Modale de Configuration des API -->
    <div id="config-modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal-content">
            <h2>Configuration</h2>
            <div class="config-grid">
                <label>OpenAI Key:</label> <input type="password" id="key-openai" placeholder="sk-...">
                <label>Anthropic Key:</label> <input type="password" id="key-anthropic" placeholder="sk-ant-...">
                <label>Google Key:</label> <input type="password" id="key-google">
                <label>Perplexity Key:</label> <input type="password" id="key-perplexity">
            </div>
            <div class="modal-actions">
                <button id="config-cancel" class="sp-modal-btn">Annuler</button>
                <button id="config-save" class="sp-modal-btn sp-modal-btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale de Gestion des Rôles -->
    <div id="sp-modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal-content">
            <h2 id="sp-modal-title">Nouveau Rôle</h2>
            <input type="text" id="sp-modal-nom" placeholder="Nom du rôle (ex: Expert Traduction)">
            <textarea id="sp-modal-contenu" placeholder="Instructions système..." rows="6"></textarea>
            <div class="modal-actions">
                <button id="sp-modal-cancel" class="sp-modal-btn">Annuler</button>
                <button id="sp-modal-save" class="sp-modal-btn sp-modal-btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale des Catégories et Emojis -->
    <div id="cat-modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal-content">
            <h2 id="cat-modal-title">Catégorie</h2>
            <input type="text" id="cat-modal-nom" placeholder="Nom de la catégorie">
            
            <label class="sp-modal-label">Icône (Emoji)</label>
            <div class="emoji-picker-container">
                <button id="cat-modal-emoji-btn" class="emoji-trigger">📁</button>
                <div id="emoji-picker" class="emoji-picker" style="display:none">
                    <input type="text" id="emoji-search" class="emoji-search" placeholder="Rechercher un emoji...">
                    <div id="emoji-tabs" class="emoji-tabs"></div>
                    <div id="emoji-grid" class="emoji-grid"></div>
                </div>
            </div>

            <label class="sp-modal-label" for="cat-modal-couleur">Couleur</label>
            <input type="color" id="cat-modal-couleur" class="cat-color-picker" value="#3b82f6">

            <div class="sp-modal-actions">
                <button id="cat-modal-delete" class="sp-modal-btn sp-modal-btn-cancel" style="color:#c00;display:none">Supprimer</button>
                <span class="sp-modal-spacer"></span>
                <button id="cat-modal-cancel" class="sp-modal-btn sp-modal-btn-cancel">Annuler</button>
                <button id="cat-modal-save" class="sp-modal-btn sp-modal-btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Visionneuse d'images (Lightbox) -->
    <div id="lightbox-overlay" class="lightbox-overlay" style="display:none">
        <button id="lightbox-close" class="lightbox-close">&times;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
    </div>

    <!-- Chargement des scripts de l'application -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="models.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filemanager.js"></script>
    <script src="js/app.js"></script>

    <!-- Enregistrement de la PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Gouda/sw.js')
            .then(reg => console.log('PWA Gouda : Service Worker enregistré.'))
            .catch(err => console.log('PWA Gouda : Échec enregistrement SW', err));
        });
      }
    </script>
</body>
</html>
